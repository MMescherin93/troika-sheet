<!--
  ИКОНКА РАСШИРЕНИЯ Owlbear Rodeo.
  Простой рисунок в формате SVG (векторная графика на основе текста).

  Смысл: три переплетённых кружка — отсылка к названию игры «Тройка!».
  Owlbear Rodeo показывает эту иконку рядом с кнопкой расширения в комнате.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#1e2126"/>
  <g fill="none" stroke="#f4f4f4" stroke-width="3.2" stroke-linejoin="round">
    <circle cx="24" cy="25" r="12"/>
    <circle cx="40" cy="25" r="12"/>
    <circle cx="32" cy="39" r="12"/>
  </g>
  <circle cx="32" cy="30" r="3.4" fill="#8a3324"/>
</svg>
